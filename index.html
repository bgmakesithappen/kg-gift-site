<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta property="og:title" content="Kellie's Gift Wishlist">
    <meta property="og:description" content="A list of gift ideas for Kellie">
    <meta property="og:type" content="website">
    <title>Kellie's Gift Wishlist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap">
    <style>
        /* Winter Evening theme */
        :root {
            --bg: #151C26;
            --surface: #1F2836;
            --surface-hover: #253042;
            --text: #EDF0F4;
            --muted: #A3AEBD;
            --border: #2D3848;
            --accent: #D6B26A;
            --accent-hover: #E2C27F;
            --accent-2: #8EB0C6;
            --pill-bg: #3A3423;
            --pill-text: #E6C77E;
            --btn-text: #1A1A1A;
            --font-display: 'Instrument Serif', Georgia, 'Times New Roman', serif;
            --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            color-scheme: dark;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: var(--font-body);
            background-color: var(--bg);
            background-image:
                radial-gradient(1.5px 1.5px at 7% 4%, rgba(214, 178, 106, 0.55) 50%, transparent 51%),
                radial-gradient(1px 1px at 18% 11%, rgba(237, 240, 244, 0.45) 50%, transparent 51%),
                radial-gradient(1.2px 1.2px at 31% 3%, rgba(142, 176, 198, 0.5) 50%, transparent 51%),
                radial-gradient(1px 1px at 46% 9%, rgba(237, 240, 244, 0.35) 50%, transparent 51%),
                radial-gradient(1.6px 1.6px at 63% 5%, rgba(214, 178, 106, 0.5) 50%, transparent 51%),
                radial-gradient(1px 1px at 77% 12%, rgba(142, 176, 198, 0.45) 50%, transparent 51%),
                radial-gradient(1.3px 1.3px at 89% 4%, rgba(237, 240, 244, 0.45) 50%, transparent 51%),
                radial-gradient(1px 1px at 95% 15%, rgba(214, 178, 106, 0.4) 50%, transparent 51%);
            background-size: 100% 420px;
            background-repeat: no-repeat;
            color: var(--text);
            padding: 3rem 2rem;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 3.25rem;
            font-weight: 400;
            line-height: 1.1;
            letter-spacing: 0.005em;
            color: var(--text);
            margin-bottom: 0.5rem;
            text-wrap: balance;
        }

        .subtitle {
            color: var(--muted);
            font-size: 1.1rem;
        }

        .gift-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.25rem;
            margin-bottom: 3rem;
        }

        .gift-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 1rem;
            padding: 1.5rem;
            text-decoration: none;
            color: inherit;
            display: block;
            transition: transform 0.25s ease, border-color 0.25s ease, background-color 0.25s ease, box-shadow 0.25s ease;
        }

        .gift-card:hover {
            transform: translateY(-3px);
            background: var(--surface-hover);
            border-color: var(--accent);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
        }

        .gift-card:focus-visible {
            outline: 2px solid var(--accent-2);
            outline-offset: 3px;
        }

        .gift-card h3 {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.4rem;
        }

        .gift-card p {
            color: var(--muted);
            font-size: 0.95rem;
        }

        .gift-card .price {
            display: inline-block;
            margin-top: 0.85rem;
            padding: 0.25rem 0.75rem;
            background: var(--pill-bg);
            border-radius: 2rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--pill-text);
        }

        .gift-card.full-width {
            grid-column: 1 / -1;
            text-align: center;
            background: var(--accent);
            border-color: var(--accent);
        }

        .gift-card.full-width:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        .gift-card.full-width h3 {
            font-family: var(--font-display);
            font-size: 1.6rem;
            font-weight: 400;
            color: var(--btn-text);
            margin-bottom: 0;
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            color: var(--muted);
            font-size: 0.9rem;
        }

        @media (max-width: 640px) {
            .gift-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 2.5rem;
            }

            body {
                padding: 2rem 1rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .gift-card {
                transition: none;
            }

            .gift-card:hover {
                transform: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Kellie's Gift Wishlist</h1>
            <p class="subtitle">Evergreen ideas for birthdays, holidays, and beyond</p>
        </header>

        <section class="gift-grid">
            <a href="https://www.amazon.com/hz/wishlist/ls/1I8W7RSPH1E35" target="_blank" rel="noopener noreferrer" class="gift-card">
                <h3>Amazon Wishlist</h3>
                <p>Start here! I keep this updated with things I actually want.</p>
                <span class="price">Various</span>
            </a>
        </section>

        <footer>
            <p>Thanks for checking out my wishlist!</p>
        </footer>
    </div>
</body>
</html>
